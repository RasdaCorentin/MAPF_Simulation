[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-simulation"
version = "0.1.0"
description = "MAPF simulation engine (core) and PIBT planner (pibt), installable as a git dependency"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["core*", "pibt*"]
