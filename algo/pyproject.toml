[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-algo"
version = "0.1.0"
description = "MAPF coordination algorithms (PIBT, LaCAM, random walk) and task allocators."
requires-python = ">=3.10"
dependencies = ["mapf-core", "mapf-mrta"]

[tool.setuptools.packages.find]
where = [".."]
include = ["algo*"]
