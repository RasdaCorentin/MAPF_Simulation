[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-pibt"
version = "0.1.0"
description = "PIBT (Priority Inheritance with Backtracking): a concrete PathPlanner."
requires-python = ">=3.10"
dependencies = ["mapf-core"]

[tool.setuptools.packages.find]
where = [".."]
include = ["pibt*"]
