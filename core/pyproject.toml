[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-core"
version = "0.1.0"
description = "Pure MAPF simulation engine: entities, grid, and the lifelong tick."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = [".."]
include = ["core*"]
